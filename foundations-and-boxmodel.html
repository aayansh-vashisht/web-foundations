<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Foundations, Units & Box Model</title>
    <style>
        /* 1. Global Reset & CSS Variables (Custom Properties) */
        :root {
            --primary-color: #2563eb;
            --surface-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --radius: 0.5rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            /* Ensures padding doesn't inflate element width */
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--surface-color);
            padding: 2rem;
            /* Using rem for scalable layout padding */
        }

        /* 2. Typography Hierarchy */
        h1 {
            font-size: 2rem;
            /* 32px */
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 1rem;
            /* 16px */
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* 3. Box Model Visual Demonstration */
        .card-container {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            /* Borders in px */
            border-radius: var(--radius);
            padding: 1.5rem;
            /* Padding: space INSIDE the border */
            margin-bottom: 2rem;
            /* Margin: space OUTSIDE the border */
            max-width: 32rem;
            /* 512px max readable line width */
        }

        /* 4. Em vs Rem Demo */
        .btn-scalable {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            padding: 0.5em 1.25em;
            /* em units scale padding proportionally with font-size */
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
        }

        .btn-scalable.large {
            font-size: 1.25rem;
            /* Padding automatically expands because it uses em */
        }
    </style>
</head>

<body>

    <h1>CSS Foundations & Box Model</h1>
    <p>Demonstrating standard CSS reset, root variables, relative units (rem/em), and explicit box sizing.</p>

    <div class="card-container">
        <h2>The Box Model in Action</h2>
        <p>This card uses <code>box-sizing: border-box</code>, <code>1.5rem</code> internal padding, and a
            <code>2px</code> solid border.</p>

        <button type="button" class="btn-scalable">Regular Button</button>
        <button type="button" class="btn-scalable large">Large Button (Scales via em)</button>
    </div>

</body>

</html>
