<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 - Links, Media, Lists, and Tables</title>
</head>
<body>

  <!-- Links -->
  <h2>Hyperlinks</h2>
  <p>
    Visit the <a href="https://developer.mozilla.org" target="_blank" rel="noopener noreferrer">MDN Web Docs</a> for references.
  </p>

  <!-- Images with Accessible Alt Text -->
  <h2>Images</h2>
  <img src="photo.png" alt="Gray placeholder graphic demonstrating image embedding" width="150" height="150">

  <!-- Ordered and Unordered Lists -->
  <h2>Lists</h2>
  <h3>Shopping List (Unordered)</h3>
  <ul>
    <li>Coffee beans</li>
    <li>Oat milk</li>
  </ul>

  <h3>Morning Routine (Ordered)</h3>
  <ol>
    <li>Wake up</li>
    <li>Brew coffee</li>
    <li>Code</li>
  </ol>

  <!-- Data Table with Accessible Header Scope -->
  <h2>Tabular Data</h2>
  <table border="1">
    <thead>
      <tr>
        <th scope="col">Topic</th>
        <th scope="col">Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>HTML Basics</td>
        <td>Completed</td>
      </tr>
      <tr>
        <td>CSS Styling</td>
        <td>In Progress</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
