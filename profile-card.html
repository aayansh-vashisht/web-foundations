<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --radius: 1rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 22rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .avatar {
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            margin-bottom: 1rem;
        }

        .name {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .role {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            margin-bottom: 1.5rem;
        }

        .stat-item strong {
            display: block;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .stat-item span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-follow {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-follow:hover {
            background-color: var(--primary-hover);
        }

        .btn-follow:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <article class="profile-card">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80"
            alt="Portrait of Sarah Jenkins" class="avatar">
        <h2 class="name">Samaya Jenkins</h2>
        <p class="role">UI/UX Engineer</p>
        <p class="bio">Passionate about design systems, accessible markup, and responsive web performance.</p>

        <div class="stats">
            <div class="stat-item">
                <strong>142</strong>
                <span>Projects</span>
            </div>
            <div class="stat-item">
                <strong>12.4k</strong>
                <span>Followers</span>
            </div>
            <div class="stat-item">
                <strong>850</strong>
                <span>Following</span>
            </div>
        </div>

        <button type="button" class="btn-follow">Follow Profile</button>
    </article>

</body>

</html>
